<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ảnh sống AR</title>
  <link rel="icon" href="data:,">
  <!-- Thư viện 3D (A-Frame) và thư viện nhận diện ảnh (MindAR), đã lưu sẵn trong thư mục lib -->
  <script src="lib/aframe.min.js"></script>
  <script src="lib/mindar-image-aframe.prod.js"></script>
  <style>
    /* Không tô màu nền cho body: nền sẽ che mất hình camera */
    html, body { margin: 0; height: 100%; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    /* Màn hình bắt đầu */
    #man-hinh-dau {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; text-align: center; color: #fff;
      background: linear-gradient(160deg, #0f2a44, #10394f 55%, #1d4d3c);
    }
    #man-hinh-dau h1 { margin: 0; font-size: 28px; }
    #man-hinh-dau p  { margin: 0; max-width: 340px; line-height: 1.5; opacity: .9; }
    #nut-bat-dau {
      margin-top: 8px; padding: 16px 40px; font-size: 20px; font-weight: 600;
      border: 0; border-radius: 999px; background: #ffd34d; color: #1b1b1b; cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
    }
    #nut-bat-dau:disabled { opacity: .6; }

    /* Dòng nhắc khi đang tìm ảnh */
    #goi-y {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 10;
      padding: 10px 18px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff;
      font-size: 15px; white-space: nowrap; display: none;
    }
    /* Nút bật/tắt tiếng */
    #nut-am-thanh {
      position: fixed; right: 16px; top: 16px; z-index: 10; display: none;
      width: 48px; height: 48px; border-radius: 50%; border: 0; font-size: 22px;
      background: rgba(0,0,0,.55); color: #fff; cursor: pointer;
    }
    #thong-bao-loi { color: #ffb4b4; display: none; }
  </style>
</head>
<body>

  <!-- 1. Màn hình bắt đầu: cần 1 lần chạm để điện thoại cho phép mở camera và phát tiếng -->
  <div id="man-hinh-dau">
    <h1>📷 Ảnh sống AR</h1>
    <p>Bấm <b>Bắt đầu</b>, cho phép dùng camera, rồi hướng camera vào bức ảnh đã in.</p>
    <button id="nut-bat-dau" disabled>Đang tải…</button>
    <p id="thong-bao-loi"></p>
  </div>

  <div id="goi-y">🔍 Hướng camera vào bức ảnh…</div>
  <button id="nut-am-thanh" title="Bật/tắt tiếng">🔊</button>

  <!-- 2. Cảnh AR
       Mỗi ảnh in (targetIndex 0, 1, 2 trong targets.mind) đi với 1 video:
         0: anh-in.jpg   → video.mp4  (Nhóm 2)
         1: anh-in-2.jpg → video2.mp4
         2: anh-in-3.jpg → video3.mp4
       Muốn thêm ảnh: thêm 1 thẻ <video> và 1 khối <a-entity> tương tự. -->
  <a-scene
    mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB" renderer="colorManagement: true"
    vr-mode-ui="enabled: false" xr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-assets timeout="2000">
      <video id="video-0" src="video.mp4"  preload="metadata" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="video-1" src="video2.mp4" preload="metadata" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="video-2" src="video3.mp4" preload="metadata" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Cả 3 video đều quay ngang 16:9 nên khung rộng 1, cao 720/1280 = 0.5625 -->
    <!-- shader: flat = hiển thị đúng màu video, không bị ánh sáng 3D làm nhạt -->
    <a-entity class="anh-dich" data-video="video-0" mindar-image-target="targetIndex: 0">
      <a-plane material="shader: flat; src: #video-0" width="1" height="0.5625"></a-plane>
    </a-entity>
    <a-entity class="anh-dich" data-video="video-1" mindar-image-target="targetIndex: 1">
      <a-plane material="shader: flat; src: #video-1" width="1" height="0.5625"></a-plane>
    </a-entity>
    <a-entity class="anh-dich" data-video="video-2" mindar-image-target="targetIndex: 2">
      <a-plane material="shader: flat; src: #video-2" width="1" height="0.5625"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const videos  = [...document.querySelectorAll('a-assets video')];
    const nutBD   = document.getElementById('nut-bat-dau');
    const manDau  = document.getElementById('man-hinh-dau');
    const goiY    = document.getElementById('goi-y');
    const nutAm   = document.getElementById('nut-am-thanh');
    const loi     = document.getElementById('thong-bao-loi');
    const scene   = document.querySelector('a-scene');
    let tatTieng  = false;

    // Khi cảnh 3D tải xong thì cho phép bấm "Bắt đầu"
    function sanSang() { nutBD.disabled = false; nutBD.textContent = 'Bắt đầu'; }
    if (scene.hasLoaded) sanSang(); else scene.addEventListener('loaded', sanSang);

    nutBD.addEventListener('click', async () => {
      nutBD.disabled = true; nutBD.textContent = 'Đang mở camera…';
      // "Mở khoá" từng video có tiếng ngay trong lần chạm này (yêu cầu của iPhone/Android)
      for (const v of videos) {
        try { v.muted = false; await v.play(); v.pause(); v.currentTime = 0; }
        catch (e) { tatTieng = true; }
      }
      if (tatTieng) { videos.forEach(v => v.muted = true); nutAm.textContent = '🔇'; }
      scene.systems['mindar-image-system'].start();
    });

    // Camera đã chạy
    scene.addEventListener('arReady', () => {
      manDau.style.display = 'none';
      goiY.style.display = 'block';
      nutAm.style.display = 'block';
    });

    // Không mở được camera
    scene.addEventListener('arError', () => {
      loi.style.display = 'block';
      loi.innerHTML = 'Không mở được camera. Hãy kiểm tra đã cho phép camera, và mở trang bằng Chrome (Android) hoặc Safari (iPhone).';
      nutBD.disabled = false; nutBD.textContent = 'Thử lại';
    });

    // Tìm thấy ảnh nào → phát đúng video của ảnh đó; mất ảnh → tạm dừng
    document.querySelectorAll('.anh-dich').forEach(el => {
      const v = document.getElementById(el.dataset.video);
      el.addEventListener('targetFound', () => {
        videos.forEach(x => { if (x !== v) x.pause(); });
        goiY.style.display = 'none'; v.play();
      });
      el.addEventListener('targetLost', () => { goiY.style.display = 'block'; v.pause(); });
    });

    // Bật/tắt tiếng
    nutAm.addEventListener('click', () => {
      tatTieng = !tatTieng;
      videos.forEach(v => v.muted = tatTieng);
      nutAm.textContent = tatTieng ? '🔇' : '🔊';
    });
  </script>
</body>
</html>
